name: Zuki device firmware

# Builds the desk-device firmware and publishes it to the CRM's install page (public/zuki-device).
on:
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install the ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.2.0
          arduino-cli lib update-index
          arduino-cli lib install "GFX Library for Arduino" "U8g2" "SensorLib" "XPowersLib" "ArduinoJson" "Improv WiFi Library"
          arduino-cli lib uninstall WiFi || true   # an old non-ESP32 WiFi library pulled in as a dependency
          arduino-cli lib list

      - name: Library facts (reported as annotations)
        shell: bash
        run: |
          L=~/Arduino/libraries
          note() { echo "::notice title=$1::$(echo "$2" | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; }
          note "touch headers" "$(find $L/SensorLib -iname '*cst9*' | sed "s|$L/||")"
          note "touch class" "$(grep -rhoE 'class TouchDrvCST9[0-9A-Za-z_]*[^{]*|bool begin\([^)]*\)|void setPins\([^)]*\)|uint8_t getPoint\([^)]*\)' $(find $L/SensorLib -iname '*cst92*' | head -3) 2>/dev/null | sort -u)"
          note "co5300" "$(grep -rhE 'Arduino_CO5300\(|setBrightness' $L/GFX_Library_for_Arduino/src/display/Arduino_CO5300.h 2>/dev/null)"
          note "canvas" "$(grep -hE 'Arduino_Canvas\(|getFramebuffer|bool begin' $L/GFX_Library_for_Arduino/src/canvas/Arduino_Canvas.h 2>/dev/null)"
          note "qspi" "$(grep -hE 'Arduino_ESP32QSPI\(' $L/GFX_Library_for_Arduino/src/databus/Arduino_ESP32QSPI.h 2>/dev/null)"
          note "improv" "$(ls $L/Improv_WiFi_Library/src 2>/dev/null; grep -hE 'void (setDeviceInfo|onImprov|setCustom|handleSerial)[^;]*' $L/Improv_WiFi_Library/src/*.h 2>/dev/null)"
          note "xpowers" "$(grep -rhoE 'bool begin\(TwoWire[^)]*\)' $L/XPowersLib/src/XPowersAXP2101.tpp $L/XPowersLib/src/*.hpp 2>/dev/null | sort -u | head -5)"
          note "esp_i2s" "$(grep -hE 'bool begin\(|bool setPins|void setPins' ~/.arduino15/packages/esp32/hardware/esp32/*/libraries/ESP_I2S/src/ESP_I2S.h 2>/dev/null)"

      - name: Check Zuki's drawing on a PC
        run: g++ -O2 -Wall -Werror -o preview firmware/tools/preview.cpp firmware/zuki/painter.cpp firmware/zuki/zuki_face.cpp && ./preview

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,CDCOnBoot=cdc,USBMode=hwcdc" \
            --warnings default --output-dir build firmware/zuki 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # Collapse the compiler errors into annotations (readable from the GitHub API).
          grep -E "error|Error|undefined reference|No such file" build.log | grep -v "^Error during build" | head -60 > errs.txt || true
          [ -s errs.txt ] || tail -40 build.log > errs.txt
          split -l 6 errs.txt chunk_
          for f in chunk_*; do echo "::error::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$f")"; done
          arduino-cli lib list | head -20 | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::notice::/'

      - name: Publish to the CRM install page
        if: github.ref == 'refs/heads/main'
        run: |
          VER=$(grep -oP 'ZUKI_FW_VERSION "\K[^"]+' firmware/zuki/config.h)
          mkdir -p public/zuki-device
          cp build/zuki.ino.merged.bin public/zuki-device/zuki.bin
          cat > public/zuki-device/manifest.json <<EOF
          {
            "name": "Zuki desk",
            "version": "$VER",
            "new_install_prompt_erase": true,
            "builds": [{ "chipFamily": "ESP32-S3", "parts": [{ "path": "zuki.bin", "offset": 0 }] }]
          }
          EOF
          git config user.name "Zukhti Home"
          git config user.email "agateshub@gmail.com"
          git add public/zuki-device
          git commit -m "Zuki device firmware $VER (built by GitHub Actions)" || exit 0
          git pull --rebase
          git push
